name: Preparation contract

on:
  pull_request:
  push:
    branches: [release/claude-mcp-v1]

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r tests/requirements.txt
      - run: python tests/test_preparation_contract.py
      - run: bash tests/fidelity-pass-hook.sh
